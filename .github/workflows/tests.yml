name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Ruff and mypy are gates: a finding fails the build. Their settings live in pyproject.toml.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  # The fast standalone job: Drafter and its two pinned dependencies only (Warden, CNS). The tests that need
  # the real Ghost scan or the full gate skip here by design; the `integration` job below runs them and fails
  # if any is skipped.
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The whole suite against the real circuit: the real Ghost scan, SWIZZLE, ASSAY and the Judge, so the tests
  # that seat the Drafter in Warden's full gate actually run. Zero skips is required: a skipped test here means
  # the circuit was not really there, and the job fails rather than report a green it did not earn.
  #
  # The four siblings are checked out at full commits, never a branch: the heads of their
  # `claude/horsemen-production-status-5wsndb` branches on the day of the CNS v2.0.0 re-pin, except JUDGE, which is
  # still at the commit it had before that re-pin. A pin may fall behind its repository's head later.
  # To bump one, see "Bumping the pins" in README.md: put the new full 40-character commit after `ref:` and update
  # the version note beside it. The `static` and `pytest` jobs do not need them. If those repositories are private,
  # add a repository secret CIRCUIT_TOKEN (a read-only token for them).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      CIRCUIT_ROOT: ${{ github.workspace }}/circuit
      PYTHONPATH: ${{ github.workspace }}/circuit/ghost_tools:${{ github.workspace }}/circuit/JUDGE:${{ github.workspace }}/circuit/SWIZZLE:${{ github.workspace }}/circuit/ASSAY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/ghost_tools
          ref: 5a9154d3c76670f5bf1f46d845acadfed46d7bc8  # ghost_tools 1.10.8
          path: circuit/ghost_tools
          token: ${{ secrets.CIRCUIT_TOKEN || github.token }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/JUDGE
          ref: e5c3f98f0f3998a8c5dac458ad0fcf4e050eb074  # JUDGE 0.4.8, not moved in this re-pin
          path: circuit/JUDGE
          token: ${{ secrets.CIRCUIT_TOKEN || github.token }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/SWIZZLE
          ref: 3f35dad5568b590c2ee36e60533d50a35db94aa2  # SWIZZLE 0.8.7
          path: circuit/SWIZZLE
          token: ${{ secrets.CIRCUIT_TOKEN || github.token }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/ASSAY
          ref: 184679c06e0a636a9a08a8403efa410b375c9429  # ASSAY 0.11.5
          path: circuit/ASSAY
          token: ${{ secrets.CIRCUIT_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The four siblings need nothing beyond CNS (which Drafter already installs) except ASSAY's numpy and
      # matplotlib, installed below. They are used as source checkouts on PYTHONPATH (the way Warden's isolation
      # reads them).
      - run: pip install -e ".[dev]"
      # ASSAY's answer key needs numpy and matplotlib: without them its verifier skips those claims and, from
      # ASSAY 0.11.1, exits 1 (the key is then not proven and the scanner is not graded). Exact versions, so a new
      # release cannot move the result. numpy 2.5.x requires Python 3.12 or newer (on 3.11 pip offers nothing past
      # 2.4.6), so the pin is per interpreter, by environment marker. matplotlib 3.11.2 installs on all three.
      - run: pip install "numpy==2.4.6; python_version < '3.12'" "numpy==2.5.4; python_version >= '3.12'" matplotlib==3.11.2
      - name: The circuit is importable
        run: python -c "import ghost_buster, judge.seat, swizzle, assay_production; print('circuit importable')"
      - name: Full suite
        run: pytest -q -rs --junitxml=junit.xml
      - name: No test may skip
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          suite = ET.parse("junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          total, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"{total} tests, {skipped} skipped")
          if skipped or not total:
              sys.exit("the integration job must run every test: a skip means part of the circuit was missing")
          PY
