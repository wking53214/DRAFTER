name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Ruff and mypy are gates: a finding fails the build. Their settings live in pyproject.toml.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  # The fast standalone job: Drafter and its two pinned dependencies only (Warden, CNS). The tests that need
  # the real Ghost scan or the full gate skip here by design; the `integration` job below runs them and fails
  # if any is skipped.
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The whole suite against the real circuit: the real Ghost scan, SWIZZLE, ASSAY and the Judge, so the tests
  # that seat the Drafter in Warden's full gate actually run. Zero skips is required: a skipped test here means
  # the circuit was not really there, and the job fails rather than report a green it did not earn.
  #
  # The four siblings are checked out at full commits, never a branch. To bump one, put the new full 40-character
  # commit after `ref:` and update the note beside it. The `static` and `pytest` jobs do not need
  # them. If those repositories are private, add a repository secret CIRCUIT_TOKEN (a read-only token for them).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      CIRCUIT_ROOT: ${{ github.workspace }}/circuit
      PYTHONPATH: ${{ github.workspace }}/circuit/ghost_tools:${{ github.workspace }}/circuit/JUDGE:${{ github.workspace }}/circuit/SWIZZLE:${{ github.workspace }}/circuit/ASSAY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wking53214/ghost_tools
          ref: 288cefa7608cace8be0f91cabcc305930466d84b  # untagged commit, package version 1.10.0 (bumped from dd1b803)
          path: circuit/ghost_tools
          token: ${{ secrets.CIRCUIT_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: wking53214/JUDGE
          ref: 97904c2a2d85cabc89a5fccfa4497ee650ce9554  # untagged commit, package version 0.4.0 (bumped from 86c55b5)
          path: circuit/JUDGE
          token: ${{ secrets.CIRCUIT_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: wking53214/SWIZZLE
          ref: 04b72b197b703e7e64be62039509c1c9e6c3bf20  # untagged commit, package version 0.8.0 (bumped from 9eb2a10)
          path: circuit/SWIZZLE
          token: ${{ secrets.CIRCUIT_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: wking53214/ASSAY
          ref: 5aafbf3b45c68d0948574ff4364cde614890839e  # untagged commit, package version 0.11.0 (bumped from 4da3919)
          path: circuit/ASSAY
          token: ${{ secrets.CIRCUIT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The four siblings have no third-party dependencies of their own beyond CNS, which Drafter already
      # installs, so they are used as source checkouts on PYTHONPATH (the way Warden's isolation reads them).
      - run: pip install -e ".[dev]"
      - name: The circuit is importable
        run: python -c "import ghost_buster, judge.seat, swizzle, assay_production; print('circuit importable')"
      - name: Full suite
        run: pytest -q -rs --junitxml=junit.xml
      - name: No test may skip
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          suite = ET.parse("junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          total, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"{total} tests, {skipped} skipped")
          if skipped or not total:
              sys.exit("the integration job must run every test: a skip means part of the circuit was missing")
          PY
