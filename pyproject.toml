[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drafter"
version = "0.2.12"
description = "The in-loop maker: turns Ghost Tools findings into proposed fixes. Proposes, never writes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["code-quality", "proposals", "change-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Warden is pinned to a full commit, not a branch or a moving tag, so a change upstream cannot silently break this
# seat; the release it is goes in the comment beside it. CNS is pinned to its release tag, spelled exactly as Warden
# and every other repository of the circuit spell it (pip treats a tag URL and a commit URL as two sources), with the
# commit the tag peels to in the comment.
# To bump: see "Bumping the pins" in README.md.
dependencies = [
    "warden @ git+https://github.com/wking53214/Warden.git@68f2a955f486a8ebb230c4395c88f7e99ee47c48",  # Warden 0.14.0
    "cns @ git+https://github.com/wking53214/CNS.git@v2.0.0",  # v2.0.0 = b13e5d2f9e0e4291725f82794b89117c3d840ac1
]

[project.urls]
Homepage = "https://github.com/wking53214/Drafter"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
drafter = "drafter.cli:main"

[tool.setuptools]
packages = ["drafter", "drafter.fixers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, B bugbear, BLE blind-except. RUF100 fails a `noqa` that suppresses nothing,
# so every `# noqa: BLE001` left in the code marks a broad catch that is really there, at a documented boundary.
select = ["E", "F", "W", "B", "BLE", "RUF100"]

[tool.mypy]
python_version = "3.11"
files = ["drafter"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Warden ships no py.typed marker, so mypy cannot read its types. Its data shapes are used as opaque values here.
module = ["warden", "warden.*"]
ignore_missing_imports = true
