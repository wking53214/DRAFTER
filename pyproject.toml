[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proposer"
version = "0.1.0"
description = "The in-loop maker: turns Ghost Tools findings into proposed fixes. Proposes, never writes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["code-quality", "proposals", "change-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["elegant @ git+https://github.com/wking53214/Elegant.git@main"]

[project.urls]
Homepage = "https://github.com/wking53214/Proposer"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["proposer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
